name: Update nightly tag

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 */1 * *'

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    name: Update nightly tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: "${{ secrets.COMMIT_KEY }}"
          
      - name: Run latest-tag
        uses: EndBug/latest-tag@15ea15c9086d0381585ddafa4717618120a6035f
        with:
          ref: nightly
