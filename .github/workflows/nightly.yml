name: Update nightly tag

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 */1 * *'

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    name: Update nightly tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: "${{ secrets.COMMIT_KEY }}"
          
      - name: Run latest-tag
        uses: EndBug/latest-tag@b1cbe90391108c0a90c6ee33ba86972cf84574e6
        with:
          ref: nightly
