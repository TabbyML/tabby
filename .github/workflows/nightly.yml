name: Update nightly tag

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 */1 * *'

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    name: Update nightly tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: "${{ secrets.COMMIT_KEY }}"

      - name: Run latest-tag
        uses: EndBug/latest-tag@952b2ca2f0de0b1161e10df340a6a057e8480a15
        with:
          ref: nightly
